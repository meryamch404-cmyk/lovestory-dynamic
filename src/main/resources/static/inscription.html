<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulaire d'inscription</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-image: url("image.jpg"); 
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        position: relative;
    }

    body::before {
        content: "";
        position: fixed;
        top: 30px;
        left: 20px;
        width: 80px;  
        height: 80px;
        background-image: url("logo1.png"); 
        background-size: cover;
        background-position: center;
        border-radius: 50%;
        z-index: 0;
    }

    .container {
        max-width: 500px; 
        margin: 40px auto;
        background: rgba(255, 255, 255, 0.95);
        padding: 20px; 
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(128, 0, 32, 0.3);
        position: relative;
        z-index: 1;
    }

    h1 {
        text-align: center;
        color: #800020;
        margin-bottom: 20px; 
        font-size: 22px;
    }

    fieldset {
        border: 1.5px solid #800020;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 6px;
    }

    legend {
        font-weight: bold;
        color: #800020;
    }

    label {
        display: block;
        margin-top: 8px;
        font-weight: bold;
        font-size: 14px;
        font-style: blue;
    }
    select {
        width: 100%;
        padding: 6px;
        margin-top: 4px;
        border-radius: 4px;
        border: 1px solid #800020;
        font-size: 14px;
    }

    input:focus, select:focus {
        outline: none;
        color: #ff4d4d;
        box-shadow: 0 0 4px #ff4d4d;
    }

    .checkbox-group, .radio-group {
        margin-top: 8px;
    }

    .buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 15px;
    }

    button {
        padding: 8px 15px;
        font-size: 14px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    button[type="submit"] {
        background-color: #0d6b2f;
        color: white;
    }

    button[type="reset"] {
        background-color: #d62828;
        color: white;
    }

    #message {
        margin-top: 15px;
        font-weight: bold;
        text-align: center;
        font-size: 14px;
    }

    select {
        margin-top: 4px;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Formulaire d'inscription</h1>
    <form id="registrationForm">
        <fieldset>
            <legend>Informations personnelles</legend>
            <label for="lastname">Nom *</label>
            <input type="text" id="lastname" name="lastname" required>

            <label for="firstname">Prénom *</label>
            <input type="text" id="firstname" name="firstname" required>

            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Téléphone</label>
            <input type="tel" id="phone" name="phone" >

            <label for="date">Date de naissance </label>
            <input type="date" id="date" name="date" >
        </fieldset>
        <fieldset>
            <legend>Informations du compte</legend>
            <label for="username">Nom d'utilisateur *</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Mot de passe *</label>
            <input type="password" id="password" name="password" required>

            <label for="confirmPassword">Confirmer le mot de passe </label>
            <input type="password" id="confirmPassword" name="confirmPassword">
        </fieldset>

        <fieldset>
            <legend>Préférences</legend>
            <div class="checkbox-group">
                <label><input type="checkbox" name="newsletter"> Newsletter</label>
                <label><input type="checkbox" name="promo"> Offres promotionnelles</label>
            </div>

            <label>Genre :</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="femme"> Femme</label>
                <label><input type="radio" name="gender" value="homme"> Homme</label>
                <label><input type="radio" name="gender" value="autre"> Autre</label>
            </div>

            <label for="country">Pays :</label>
            <select id="country" name="country">
                <option value="">Sélectionnez</option>
                <option value="france">France</option>
                <option value="tunisie">Tunisie</option>
                <option value="algerie">Algérie</option>
            </select>

            <label for="city">Ville :</label>
            <select id="city" name="city">
                <option value="">Sélectionnez</option>
                <option value="paris">Paris</option>
                <option value="tunis">Tunis</option>
                <option value="alger">Alger</option>
            </select>
        </fieldset>

        <fieldset>
            <label><input type="checkbox" id="terms" required> J'accepte les termes et conditions *</label>
        </fieldset>

        <div class="buttons">
            <button type="submit">Soumettre</button>
            <button type="reset">Réinitialiser</button>
        </div>
        <div id="message"></div>
    </form>
</div>

<script>
const form = document.getElementById("registrationForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function (e) {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  const errors = [];
  if ((data.phone || "").trim() && data.phone.trim().length < 8) errors.push("Numéro de téléphone invalide.");
  if ((data.password || "").length < 8) errors.push("Le mot de passe doit contenir au moins 8 caractères.");
  if (data.password !== data.confirmPassword) errors.push("Les mots de passe ne correspondent pas.");
  if (!document.getElementById("terms").checked) errors.push("Vous devez accepter les termes et conditions.");
  if (errors.length) {
    message.style.color = "red";
    message.textContent = errors.join(" ");
    return;
  }
  const payload = {
    lastname: data.lastname, firstname: data.firstname, email: data.email,
    phone: data.phone, date: data.date, username: data.username,
    password: data.password, confirmPassword: data.confirmPassword,
    country: data.country, city: data.city
  };
  try {
    const response = await fetch("/api/register", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.message || result.detail || "Inscription impossible.");
    message.style.color = "green";
    message.textContent = result.message;
    form.reset();
  } catch (err) {
    message.style.color = "red";
    message.textContent = "Erreur : " + (err.message || "serveur inaccessible") + ". Vérifiez que le site est lancé depuis Spring Boot.";
  }
});
</script>
</body>
</html>
